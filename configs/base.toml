# ArtFlow training configuration.
#
# One file per experiment. Everything that defines *what* is trained lives
# here; the command line only carries run-time control (which config to load,
# where to write, whether to resume, whether to profile).
#
# Values are grouped by the part of the training loop they feed. Where a value
# came from a measurement, the comment says what was measured and where the
# number can be reproduced.

[data]
# Row-level sampling weights: one "path:weight" per dataset, space separated.
# A dataset is drawn first, then a row inside it, then exactly one caption
# inside that row, so a row with several captions is not sampled several times.
mix = ""
# Per-resolution table of [[max_caption_length, micro_batch], ...]. A row is
# assigned to the first bucket whose max_caption_length is >= its retained
# token count. Every resolution id present in the data must appear here.
bucket_plan = ""
# Probability of replacing a caption with the empty string for classifier-free
# guidance.
caption_dropout_prob = 0.1
# Which caption inside a drawn row is used.
#   "legacy" — the original heuristic short-to-long curriculum.
#   "beta"   — select on exact retained lengths with a length preference and a
#              short-caption reserve. See src/dataset/captions.py for the formula.
caption_policy = "legacy"
# Caption-selection curriculum endpoints. 0.0 prefers the shortest caption in
# a row, 1.0 the longest; the value is interpolated linearly over training.
# With caption_policy = "beta" this same 0..1 value is the progress u that
# drives the preference below, so leave it at 0.0/1.0 unless the schedule is
# meant to start part-way through.
curriculum_start = 0.0
curriculum_end = 1.0
# Length preference at the start and end of the run: beta > 0 favours longer
# captions, beta < 0 shorter, beta = 0 uniform. beta = 1 means a caption twice
# as long is twice as likely.
caption_beta_start = -1.0
caption_beta_end = 1.0
# "linear" ramps beta over the run; "early" reaches beta_end at
# caption_early_at and holds it; "stationary" uses each row's schedule-averaged
# probabilities throughout, which fixes exposure and removes only the ordering.
caption_schedule = "linear"
caption_early_at = 0.5
# Probability reserved for the short-caption group of a row (captions below
# caption_short_threshold tokens). The reserve covers the group, not each
# caption, so adding more long variants does not dilute it.
caption_short_reserve = 0.20
caption_short_threshold = 256
# How often the sampler is told the current curriculum position, in optimizer
# steps.
stage_sync_interval = 1

[model]
# Width and depth of the transformer. The shipped recipe is 1152 x 24.
hidden_size = 1152
num_heads = 16
double_stream_depth = 0
single_stream_depth = 24
mlp_ratio = 2.67
# "fused" folds the pooled text vector into the modulation path; "pure" keeps
# it out. Measured: fused won the architecture sweep on eval/loss.
conditioning_scheme = "fused"
double_stream_modulation = "none"
# "layer" shares one modulation projection per layer; "none" gives every
# block its own. Measured: layer won on eval/loss and used ~8% less memory.
single_stream_modulation = "layer"
ffn_type = "gated"
qkv_bias = true
# Positions the image patch grid at the origin of the RoPE coordinate system
# and pins text to a fixed diagonal. Measured: ties on eval/loss at 256p and
# transfers better at higher resolution than the alternative.
rope_centered_grid = true

[text_encoder]
# Frozen encoder; only its hidden states are used, never its gradients.
path = "Qwen/Qwen3-0.6B"
# Hidden state index to read. Measured: stopping after layer 20 matches the
# full forward bit-for-bit and skips the remaining 8 layers (~29% of the
# encoder forward).
exit_layer = 20

[optim]
learning_rate = 3e-4
start_learning_rate = 1e-5
min_learning_rate = 0.5e-4
lr_scheduler_type = "linear_cosine"
lr_warmup_steps = 500
max_grad_norm = 1.0
# Muon orthogonalizes 2D hidden weights; every other parameter is updated by
# an auxiliary AdamW. Measured: Muon beat AdamW by 1.1% eval/loss and 24% KID
# at equal steps, for ~10% more step time.
muon_lr = 0.02
muon_wd = 0.01
muon_momentum = 0.95

[train]
max_steps = 50000
seed = 42
# Micro-batches per optimizer step. Together with the bucket table this fixes
# the number of samples per optimizer step.
gradient_accumulation_steps = 16
num_workers = 8
use_ema = true
# EMA memory is roughly 1/(1-decay) steps: 0.9999 spans ~10k steps, 0.999
# ~1k. Match it to the run length so the averaged weights track the live ones.
ema_decay = 0.999
ema_update_interval = 1
# Logit-normal timestep sampling concentrates training on mid-noise levels.
use_logit_normal_sampling = true
logit_normal_mu = 0.0
logit_normal_sigma = 1.0
checkpoint_interval = 500
# How often the (expensive) image-space evaluation runs. The cheap fixed-sample
# loss probe is [eval].loss_interval.
eval_interval = 100000
# Optimizer steps dropped from the reported steady-state throughput, so a
# short run is not penalised for one-time compile and allocator warm-up.
steady_state_skip_steps = 50
# Per-sample loss weight as a function of the caption's retained length.
# "none" (the default) leaves every weight at 1.0, so a step is the plain
# arithmetic mean over its samples; "log2" gives each sample
# max(1, log2(L / caption_loss_weight_reference)) evaluated at that sample's own
# retained length L. A curve rather than a table: it extends itself to whatever
# length shows up, and 1.0 is the floor, so a caption shorter than the reference
# is never downweighted below its plain share.
#
# The weights reweight the samples of a step, they do not resize the step: the
# gradient is divided by the sum of the weights of that step, so the loss stays
# a weighted mean and a reweighted run remains comparable with an unweighted
# one at equal step counts. A caption dropped for classifier-free guidance
# keeps weight 1.0 — the curve says how much a caption's length should matter,
# not how the unconditional examples should be weighted. Where the weight went
# is logged as caption/weight_mean (the mean weight over the conditioned
# samples) and caption/grad_weighted_mean_tokens (the weight-weighted mean
# caption length the step's gradient worked on). An unknown curve or a
# reference below 2 is rejected at startup rather than repaired.
caption_loss_weight_curve = "none"
caption_loss_weight_reference = 128

[eval]
dataset_path = ""
batch_size = 8
# Fixed-sample loss probe. It runs at a fixed seed, fixed captions per image
# and fixed timesteps, so two runs at the same step are directly comparable.
# Captions are drawn per caption-length band, so loss_samples is a budget per
# band: up to one sample per band for an image, and bands the held-out set
# cannot fill report how short they fell.
loss_interval = 50
loss_samples = 512
prompts_file = "assets/eval/prompts_v1.jsonl"
kid_at_end = false
kid_num_fake = 2000

[paths]
vae = "REPA-E/e2e-qwenimage-vae"
output_dir = "output"

[telemetry]
log_interval = 25
# Periodically return cached blocks to the allocator. Long runs with variable
# shapes fragment without this.
cache_clear_interval = 100
swanlab_project = "artflow"
