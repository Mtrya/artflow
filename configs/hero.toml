# Complete Ascend pretraining run. All tunables are required; no overlays.
# Dataset/model/output paths are relative to the required --storage-root.
# Prompt and bucket-plan paths are repository-relative under configs/.
# Bucket plans and accumulation target 16 Ascend 910B2C cards.
# Measurement conditions and transition checks are in notes/infra_pretrain.md.

[paths]
vae = "models/e2e-qwenimage-vae"
output_dir = "runs"

[model]
hidden_size = 1152
num_heads = 16
double_stream_depth = 1
single_stream_depth = 24
# 8/3 gives a 3072-wide gated FFN at hidden size 1152. Aligned matrix
# dimensions improve Ascend training throughput with negligible capacity loss.
mlp_ratio = 2.6666666666666665

[text_encoder]
path = "models/Qwen3-0.6B"
exit_layer = 20

[optim]
learning_rate = 1e-4
start_learning_rate = 1e-5
min_learning_rate = 5e-6
lr_warmup_steps = 20000
max_grad_norm = 1.0
adam_wd = 0.01
# Separate decay for txt_pooled_proj.weight and the two c_mlp matrices.
# At peak AdamW LR, 0.4 gives shrinkage 4e-5/update without changing the
# decay of embeddings, biases, output projection or normalization gains.
adam_conditioning_wd = 0.4
adam_eps = 1e-8
adam_betas = [0.9, 0.95]
# Original Muon convention: square/wide chunks use multiplier 1, tall chunks
# use sqrt(rows/cols). Weight decay is multiplied by the base learning rate.
muon_lr = 0.02
# Peak shrinkage is 0.02 * 0.0015 = 3e-5 per update.
muon_wd = 0.0015
muon_momentum = 0.95

[data]
caption_dropout_prob = 0.1
curriculum_start = 0.0
curriculum_end = 1.0
caption_beta_start = -1.0
caption_beta_end = 1.0
caption_short_reserve = 0.20
caption_short_threshold = 256

[train]
run_name = "ascend-hero-pretrain"
seed = 42
num_workers = 8
ema_decay = 0.9999
ema_update_interval = 1
logit_normal_mu = 0.0
logit_normal_sigma = 1.0
checkpoint_interval = 2000
checkpoint_keep_last = 2
eval_interval = 2500
steady_state_skip_steps = 50
caption_loss_weight_reference = 128

[eval]
batch_size = 8
loss_interval = 500
loss_samples = 512
prompts_file = "configs/prompts/hero_monitor_v1.jsonl"
ode_steps = 50
# Zero disables final KID evaluation.
kid_num_fake = 2000

[telemetry]
log_interval = 25
swanlab_project = "artflow"
health_interval = 250
stability_interval = 100

[[stages]]
name = "256p"
end_step = 450000
gradient_accumulation_steps = 1
bucket_plan = "configs/bucket_plans/hero-256p-k20.json"
eval_dataset_path = "precomputed_dataset/light-eval@256p"
grid_steps = [450000]

