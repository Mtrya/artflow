# Continue the completed branch-norm checkpoint at step 2000 for 1000 updates.
# The launcher restores its exact input manifest, bucket plan and sampler.
[model]
branch_norm = true
cond_norm = false

[optim]
muon_lr = 0.02
muon_wd = 0.01
learning_rate = 3e-4
start_learning_rate = 1e-5
min_learning_rate = 1.5e-5
lr_warmup_steps = 200
grad_spike_skip = 0.0

[train]
max_steps = 200000
stop_at_step = 3000
gradient_accumulation_steps = 2
ema_decay_warmup = true
checkpoint_interval = 500
checkpoint_keep_last = 2
eval_interval = 1000000

[eval]
loss_interval = 500
loss_samples = 48
grid_steps = []
kid_at_end = false

[telemetry]
log_interval = 10
health_interval = 500
stability_interval = 100
cache_clear_interval = 0
